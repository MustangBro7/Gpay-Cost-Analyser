name: Deploy Cloudflare Backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy-cloudflare-worker:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare-backend/cloudflare-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cloudflare-backend/cloudflare-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Worker
        run: npm run check

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c064bc22afe7d6511334c0c5cdd43bc1
        run: npx wrangler deploy
